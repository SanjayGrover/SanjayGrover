<svg xmlns="http://www.w3.org/2000/svg" width="900" height="260" viewBox="0 0 900 260" role="img" aria-label="Sanjay Grover: AI, embedded systems, offline-first software" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0f1e"/>
      <stop offset="1" stop-color="#111c38"/>
    </linearGradient>
    <linearGradient id="ac" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0H0V30" fill="none" stroke="#ffffff" stroke-opacity="0.05"/>
    </pattern>
  </defs>

  <rect width="900" height="260" rx="16" fill="url(#bg)"/>
  <rect width="900" height="260" rx="16" fill="url(#grid)"/>

  <!-- boot log -->
  <g font-family="'Fira Code','JetBrains Mono',Consolas,monospace" font-size="13">
    <text x="48" y="52" fill="#4ade80" opacity="0">[ ok ] wake word listener
      <animate attributeName="opacity" from="0" to="0.9" begin="0.3s" dur="0.4s" fill="freeze"/>
    </text>
    <text x="48" y="74" fill="#4ade80" opacity="0">[ ok ] on-device llm
      <animate attributeName="opacity" from="0" to="0.9" begin="0.9s" dur="0.4s" fill="freeze"/>
    </text>
    <text x="48" y="96" fill="#4ade80" opacity="0">[ ok ] mcp tools loaded
      <animate attributeName="opacity" from="0" to="0.9" begin="1.5s" dur="0.4s" fill="freeze"/>
    </text>
    <text x="48" y="118" fill="#fbbf24" opacity="0">[ -- ] network unavailable, carrying on anyway
      <animate attributeName="opacity" from="0" to="0.9" begin="2.1s" dur="0.4s" fill="freeze"/>
    </text>
  </g>

  <!-- name -->
  <text x="48" y="178" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="58" font-weight="700" fill="url(#ac)" opacity="0">Sanjay Grover
    <animate attributeName="opacity" from="0" to="1" begin="2.6s" dur="0.8s" fill="freeze"/>
  </text>
  <text x="50" y="210" font-family="'Fira Code','JetBrains Mono',Consolas,monospace" font-size="17" fill="#cbd5e1" opacity="0">AI  ·  Embedded Systems  ·  Offline-first Software
    <animate attributeName="opacity" from="0" to="1" begin="3.2s" dur="0.8s" fill="freeze"/>
  </text>

  <!-- blinking prompt -->
  <text x="50" y="240" font-family="'Fira Code','JetBrains Mono',Consolas,monospace" font-size="15" fill="#22d3ee">&gt; _
    <animate attributeName="opacity" values="1;0;1" dur="1.2s" repeatCount="indefinite"/>
  </text>

  <!-- arc reactor -->
  <g transform="translate(770,130)">
    <circle r="78" fill="none" stroke="#22d3ee" stroke-opacity="0.25" stroke-width="2"/>
    <circle r="58" fill="none" stroke="url(#ac)" stroke-width="3" stroke-dasharray="14 10">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="14s" repeatCount="indefinite"/>
    </circle>
    <circle r="40" fill="none" stroke="#a78bfa" stroke-opacity="0.7" stroke-width="2" stroke-dasharray="4 8">
      <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="9s" repeatCount="indefinite"/>
    </circle>
    <circle r="16" fill="#22d3ee" fill-opacity="0.9">
      <animate attributeName="r" values="14;19;14" dur="2.4s" repeatCount="indefinite"/>
      <animate attributeName="fill-opacity" values="0.6;1;0.6" dur="2.4s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
